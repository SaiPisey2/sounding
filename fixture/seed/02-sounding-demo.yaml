# sounding-demo carries the shape the whole project is judged against: a
# Deployment -> ReplicaSet -> Pod chain three owners deep, a Service, a
# ConfigMap, a Secret, and two PVCs bound to PVs whose reclaim policies
# differ -- pv-delete makes this namespace TERMINAL, and it alone is what
# TestReclaimPolicyFlipsTheClassAgainstALiveCluster depends on.
#
# The container image is registry.k8s.io/pause -- every kind node already
# holds it locally as its own sandbox image, so the Deployment reaches
# Running with no network pull and no registry dependency.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: sounding-demo
  labels:
    sounding.dev/fixture: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: registry.k8s.io/pause:3.10
        resources:
          requests:
            cpu: 5m
            memory: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sounding-demo
  labels:
    sounding.dev/fixture: "true"
spec:
  selector:
    app: api
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sounding-demo
  labels:
    sounding.dev/fixture: "true"
data:
  greeting: hello
---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: sounding-demo
  labels:
    sounding.dev/fixture: "true"
type: Opaque
stringData:
  token: not-a-real-secret
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-retain
  namespace: sounding-demo
  labels:
    sounding.dev/fixture: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: sounding-retain
  resources:
    requests:
      storage: 1Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-delete
  namespace: sounding-demo
  labels:
    sounding.dev/fixture: "true"
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: sounding-delete
  resources:
    requests:
      storage: 1Mi
