# Applied by `make demo-up` only after the cluster and the rest of the seed
# already exist -- see the Makefile. That ordering is the point: a Widget
# registered after sounding's binary could have been built is the only way
# the live-discovery test (TestACRDRegisteredNowIsEnumerated) proves
# anything. Applying it up front, in the same batch as the namespaces, would
# let a cached or pre-baked resource list pass that test for the wrong
# reason.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.sounding.dev
  labels:
    sounding.dev/fixture: "true"
spec:
  group: sounding.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    listKind: WidgetList
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
